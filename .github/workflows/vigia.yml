name: Vigía de vacantes

on:
  schedule:
    - cron: "17 11 * * 1-5"   # lunes a viernes, 6:17 a. m. hora de Bogotá
  workflow_dispatch: {}        # botón "Run workflow" para correrlo cuando quieras

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Navegador (solo si render_js está activo)
        run: |
          if grep -qE '^render_js:\s*true' config.yaml; then
            pip install playwright && python -m playwright install --with-deps chromium
          fi
      - name: Revisar páginas del radar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
        run: python vigia.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add datos salida
          git diff --cached --quiet || git commit -m "Vigía: corrida $(date -u +%Y-%m-%d)"
          git push
